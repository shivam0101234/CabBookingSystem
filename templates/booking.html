<!DOCTYPE html>
<html>

<head>
    <title>Book Cab</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

<h1 class="text-center mb-4">
🚖 Book Your Ride
</h1>

<form method="POST">

{% csrf_token %}

<div class="mb-3">
<label>Name</label>
<input type="text" class="form-control" name="name" required>
</div>

<div class="mb-3">
<label>Mobile Number</label>
<input type="text" class="form-control" name="mobile" required>
</div>

<div class="mb-3">
<label>Pickup Location</label>
<input type="text" class="form-control" name="pickup" required>
</div>

<div class="mb-3">
<label>Drop Location</label>
<input type="text" class="form-control" name="drop" required>
</div>

<!-- NEW FIELD -->
<div class="mb-3">
<label>Number of Members</label>
<input type="number"
       class="form-control"
       name="members"
       min="1"
       max="10"
       value="1"
       required>
</div>

<div class="mb-3">

<label>Cab Category</label>

<select class="form-control" name="cab_type" required>

    <option>Mini</option>
    <option>Sedan</option>
    <option>SUV</option>

</select>
</div>

<div class="mb-3">
<label>Date</label>

<input type="date" class="form-control" name="date" required>

</div>

<div class="mb-3">
<label>Time</label>

<input type="time" class="form-control" name="time" required>

</div>

<button type="submit" class="btn btn-success w-100">

Book Ride

</button>

</form>

</div>

</body>

</html>
